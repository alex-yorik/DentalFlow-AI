name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name (ghcr requires lowercase)
        id: normalize
        run: |
          IMAGE_NAME="${{ github.repository }}"
          echo "image_name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.normalize.outputs.image_name }}:${{ github.ref_name }}
            ghcr.io/${{ steps.normalize.outputs.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true