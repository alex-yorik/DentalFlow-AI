x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"

services:
  telegram:
    build:
      context: .
    command: ["python", "-m", "src.entrypoints.telegram"]
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      WATCHED_SERVICE: "telegram"
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-30}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "docker/worker_healthcheck.py"]
      interval: ${HEALTHCHECK_INTERVAL:-300s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      start_period: ${HEALTHCHECK_START_PERIOD:-40s}
      retries: ${HEALTHCHECK_RETRIES:-3}
    networks:
      - backend
    mem_limit: 384m
    cpus: "0.5"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./docker/certs:/etc/nginx/certs:ro
    networks:
      - backend
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 64m
    cpus: "0.25"

  web:
    build:
      context: .
    command: ["python", "-m", "src.entrypoints.web"]
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "docker/healthcheck.py"]
      interval: ${HEALTHCHECK_INTERVAL:-300s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      start_period: ${HEALTHCHECK_START_PERIOD:-10s}
      retries: ${HEALTHCHECK_RETRIES:-3}
    networks:
      - backend
    mem_limit: 512m
    cpus: "1.0"

  followup:
    build:
      context: .
    command: ["python", "-m", "src.entrypoints.followup"]
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      WATCHED_SERVICE: "followup"
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-30}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "docker/worker_healthcheck.py"]
      interval: ${HEALTHCHECK_INTERVAL:-300s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      start_period: ${HEALTHCHECK_START_PERIOD:-40s}
      retries: ${HEALTHCHECK_RETRIES:-3}
    networks:
      - backend
    mem_limit: 256m
    cpus: "0.5"

  watchdog:
    build:
      context: .
    command: ["python", "-m", "src.entrypoints.watchdog"]
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      WATCHDOG_WEB_URL: http://web:8080/health
    volumes:
      - ./data:/app/data
    healthcheck:
      # always-healthy by design: worker liveness is covered by watchdog heartbeats
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - backend
    depends_on:
      - web
      - telegram
      - followup
    mem_limit: 128m
    cpus: "0.25"

  backup:
    build:
      context: .
    command: ["python", "-m", "src.entrypoints.backup"]
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-6}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./data:/app/data
    healthcheck:
      # always-healthy by design: worker liveness is covered by watchdog heartbeats
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - backend
    depends_on:
      - telegram
      - web
      - followup
    mem_limit: 128m
    cpus: "0.25"

networks:
  backend:
    driver: bridge