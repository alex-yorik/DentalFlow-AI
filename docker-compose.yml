services:
  telegram:
    build:
      context: .
      args:
        HEALTHCHECK_INTERVAL: ${HEALTHCHECK_INTERVAL:-30s}
        HEALTHCHECK_TIMEOUT: ${HEALTHCHECK_TIMEOUT:-10s}
        HEALTHCHECK_START_PERIOD: ${HEALTHCHECK_START_PERIOD:-10s}
        HEALTHCHECK_RETRIES: ${HEALTHCHECK_RETRIES:-3}
    command: ["python", "-m", "src.entrypoints.telegram"]
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "docker/worker_healthcheck.py"]
      environment:
        WATCHED_SERVICE: "telegram"
        HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-30}
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      start_period: ${HEALTHCHECK_START_PERIOD:-40s}
      retries: ${HEALTHCHECK_RETRIES:-3}
    networks:
      - backend
    mem_limit: 384m
    cpus: "0.5"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - backend
    depends_on:
      - web
    mem_limit: 64m
    cpus: "0.25"

  web:
    build:
      context: .
      args:
        HEALTHCHECK_INTERVAL: ${HEALTHCHECK_INTERVAL:-30s}
        HEALTHCHECK_TIMEOUT: ${HEALTHCHECK_TIMEOUT:-10s}
        HEALTHCHECK_START_PERIOD: ${HEALTHCHECK_START_PERIOD:-10s}
        HEALTHCHECK_RETRIES: ${HEALTHCHECK_RETRIES:-3}
    command: ["python", "-m", "src.entrypoints.web"]
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "docker/healthcheck.py"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      start_period: ${HEALTHCHECK_START_PERIOD:-10s}
      retries: ${HEALTHCHECK_RETRIES:-3}
    networks:
      - backend
    mem_limit: 512m
    cpus: "1.0"

  followup:
    build:
      context: .
      args:
        HEALTHCHECK_INTERVAL: ${HEALTHCHECK_INTERVAL:-30s}
        HEALTHCHECK_TIMEOUT: ${HEALTHCHECK_TIMEOUT:-10s}
        HEALTHCHECK_START_PERIOD: ${HEALTHCHECK_START_PERIOD:-10s}
        HEALTHCHECK_RETRIES: ${HEALTHCHECK_RETRIES:-3}
    command: ["python", "-m", "src.entrypoints.followup"]
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "docker/worker_healthcheck.py"]
      environment:
        WATCHED_SERVICE: "followup"
        HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-30}
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      start_period: ${HEALTHCHECK_START_PERIOD:-40s}
      retries: ${HEALTHCHECK_RETRIES:-3}
    networks:
      - backend
    mem_limit: 256m
    cpus: "0.5"

  watchdog:
    build:
      context: .
    command: ["python", "-m", "src.entrypoints.watchdog"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WATCHDOG_WEB_URL: http://web:8080/health
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - backend
    depends_on:
      - web
      - telegram
      - followup
    mem_limit: 128m
    cpus: "0.25"

networks:
  backend:
    driver: bridge