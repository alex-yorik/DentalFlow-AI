services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    mem_limit: 512m
    cpus: "1.0"
    ports:
      - "8080:8080"
    networks:
      - backend

networks:
  backend:
    driver: bridge